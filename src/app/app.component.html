<mat-sidenav-container class="main-menu">
    <mat-sidenav mode="side" opened>
        <div class="menu-list-content">
            <a [routerLink]="['/dashboard']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <span>
                    <mat-icon aria-hidden="false" aria-label="dashboard icon" fontIcon="bar_chart_4_bars"></mat-icon>
                    Dashboard
                </span>
            </a>
            <a
                [routerLink]="['/tasksPage']"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                <span>
                    <mat-icon aria-hidden="false" aria-label="tasks icon" fontIcon="check_circle"></mat-icon>
                    Board
                </span>
            </a>
            <a
                [routerLink]="['/configPage']"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                <span>
                    <mat-icon aria-hidden="false" aria-label="config icon" fontIcon="settings"></mat-icon>
                    Configuration
                </span>
            </a>
        </div>
    </mat-sidenav>
    <mat-sidenav-content>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
